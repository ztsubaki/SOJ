services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soj}
      POSTGRES_USER: ${POSTGRES_USER:-soj}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  soj:
    build: .
    image: soj:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "3001:3001"
      - "50051:50051"
      - "8080:8080"
    volumes:
      - soj-artifacts:/var/lib/soj/artifacts
      - soj-tls:/var/lib/soj/tls

volumes:
  postgres-data:
  soj-artifacts:
  soj-tls:
